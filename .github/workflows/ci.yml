name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci` triggers the postinstall hook, which runs `prisma generate`.
      # No database is required for that, so this job needs no services.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      # openapi.json is the contract both frontends generate their types from,
      # so a stale committed spec silently desynchronises three repos.
      - name: Check openapi.json is up to date
        env:
          # Generating the spec boots the Nest application, so it has to satisfy
          # environment validation. Nothing here is contacted — no request is
          # ever made — and the signing key is never used to mint a token.
          DATABASE_URL: postgresql://physio:physio@localhost:5432/physio?schema=public
          REDIS_URL: redis://localhost:6379
          JWT_ACCESS_SECRET: ci-openapi-generation-key-never-signs-a-real-token
          # The committed contract is the dev-bypass contract: while decision B6
          # stands, /auth/dev-login is how the CRM signs in, so the CRM must be
          # able to generate a type for it. Flip this to false in the same
          # commit that deletes the bypass.
          AUTH_DEV_BYPASS: 'true'
        run: |
          npm run generate:openapi
          git diff --exit-code openapi.json
