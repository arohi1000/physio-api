name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-latest
    # A misconfigured database URL makes the e2e suite hang on connect rather
    # than fail, which otherwise burns the runner's full six-hour allowance.
    timeout-minutes: 15

    # The booking-concurrency test is this project's one non-negotiable gate, and
    # it needs a real database — a mocked one cannot exhibit a lock race. Without
    # these services the e2e suite only ever ran on a developer's machine, so a
    # regression in the advisory lock would have shipped with CI still green.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: physio
          POSTGRES_PASSWORD: physio
          POSTGRES_DB: physio
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U physio"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://physio:physio@localhost:5432/physio?schema=public
      REDIS_URL: redis://localhost:6379
      # `test/setup-e2e.ts` deliberately overrides DATABASE_URL/REDIS_URL so a
      # local run can never touch development data. It reads these two names, so
      # CI must set them or the suite dials the developer's ports and hangs.
      TEST_DATABASE_URL: postgresql://physio:physio@localhost:5432/physio_test?schema=public
      TEST_REDIS_URL: redis://localhost:6379/1
      JWT_ACCESS_SECRET: ci-test-key-never-signs-a-production-token
      RESCHEDULE_TOKEN_SECRET: ci-test-key-never-signs-a-production-token
      AUTH_DEV_BYPASS: 'true'

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm

      # `npm ci` triggers the postinstall hook, which runs `prisma generate`.
      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      - name: Apply migrations and seed
        run: |
          npx prisma migrate deploy
          npx prisma db seed

      # The e2e suite runs against its own database and Redis logical DB 1, so a
      # failed-login lockout in a test cannot lock the seeded account out of the
      # main one. It needs the same schema and fixtures.
      - name: Prepare integration-test database
        env:
          PGPASSWORD: physio
        run: |
          psql -h localhost -U physio -d postgres -c 'CREATE DATABASE physio_test;'
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma migrate deploy
          DATABASE_URL="$TEST_DATABASE_URL" npx prisma db seed

      # The gate test lives here. `test:e2e` runs in band against the services
      # above, so a broken booking lock fails the build rather than reaching main.
      - name: Integration and e2e tests
        run: npm run test:e2e

      - run: npm run build

      # openapi.json is the contract both frontends generate their types from,
      # so a stale committed spec silently desynchronises three repos.
      # The committed contract is currently the dev-bypass contract: while
      # decision B6 stands, /auth/dev-login is how the CRM signs in, so the CRM
      # must be able to generate a type for it. AUTH_DEV_BYPASS flips to false in
      # the same commit that deletes the bypass.
      - name: Check openapi.json is up to date
        run: |
          npm run generate:openapi
          git diff --exit-code openapi.json
